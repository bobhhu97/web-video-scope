<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Video Scopes Test Harness</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #0b0f12; color: #b9c6d0; font: 12px/1.5 ui-monospace, monospace; }
      h1 { font-size: 13px; font-weight: 500; margin: 16px; color: #d7e3ec; }
      .row { display: flex; gap: 16px; padding: 0 16px 16px; flex-wrap: wrap; }
      .col { display: flex; flex-direction: column; gap: 8px; }
      .label { color: #7d8b96; }
      canvas { background: #000; display: block; }
      video { width: 640px; display: block; background: #000; }
      /* The scope canvases are transparent; the panel supplies the background. */
      .stage { position: relative; width: 640px; height: 340px; background: #0d1117; border: 1px solid #ffffff14; }
      .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .stage canvas.grat { pointer-events: none; }
      #status { color: #8cd9a5; }
      .presets a { color: #7fa8d8; margin-right: 10px; }
    </style>
  </head>
  <body>
    <h1>Video Scopes Test Harness</h1>
    <div class="row" style="padding-bottom: 0">
      <div class="presets">
        <a href="?range=limited&units=ire">limited · IRE</a>
        <a href="?range=full&units=ire">full · IRE</a>
        <a href="?range=limited&units=code8">limited · 8-bit</a>
        <a href="?range=limited&mode=waveform-rgb">RGB overlay</a>
        <a href="?range=limited&mode=waveform-parade">parade</a>
        <a href="?range=limited&mode=vectorscope">vectorscope</a>
        <a href="?range=limited&mode=cie">CIE</a>
        <a href="?range=limited&analysis=low">low preset</a>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <span class="label">Pattern → captureStream → &lt;video&gt;</span>
        <canvas id="pattern" width="1280" height="720" style="width: 640px"></canvas>
        <video id="video" muted playsinline loop autoplay></video>
        <p id="status">initializing…</p>
      </div>
      <div class="col">
        <span class="label">Scope (GPU density + 2D graticule)</span>
        <div class="stage">
          <canvas class="gpu" id="scope-gpu"></canvas>
          <canvas class="grat" id="scope-grat"></canvas>
        </div>
      </div>
    </div>
    <script type="module" src="harness.js"></script>
  </body>
</html>

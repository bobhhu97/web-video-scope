name: Feature request
description: Suggest an improvement or a new scope
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem you want solved before the solution. For
        scope changes, tell us what the result should be checked against (a
        standard, another scope, or a known test pattern).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you thought of solving this.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New scope / visualisation
        - Colour accuracy
        - UI / UX
        - Performance
        - Docs
        - Other
    validations:
      required: true
